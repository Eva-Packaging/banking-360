# Kafka broker configuration for local development.
# Environment variables defined in docker-compose.yml take precedence over this file.
# This file is mounted at /opt/kafka/config/server.properties inside the container.

log.dirs=/var/lib/kafka/data
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
